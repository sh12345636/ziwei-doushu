name: Build Android APK

# 在 GitHub 的免费服务器上构建 APK —— 手机不需要装任何开发工具。
#
# 用法：
#   1. 把仓库推到 GitHub
#   2. 打开仓库页面 → Actions → 「Build Android APK」→ Run workflow
#   3. 跑完后在该次运行的 Artifacts 里直接下载 APK，传到手机安装
#
# 每次 push 到 main 也会自动构建一次。

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建静态站点
        run: npm run build

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成 / 同步 Android 工程
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ziwei-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── 可选：自动发布到 Release（取消注释并把 tag 打上即可）──
      # - name: 发布到 Release
      #   uses: softprops/action-gh-release@v2
      #   if: startsWith(github.ref, 'refs/tags/')
      #   with:
      #     files: android/app/build/outputs/apk/debug/*.apk
